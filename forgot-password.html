<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Trip Advisor</title>
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Reset Password</h1>
            <p style="text-align: center; color: rgba(255, 255, 255, 0.6); font-size: 14px; margin-bottom: 25px;">
                Enter your email address and we'll send you a link to reset your password.
            </p>

            <!-- Alert Messages -->
            <div id="alertBox" class="alert"></div>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="emailInput">Email</label>
                    <input 
                        type="email" 
                        id="emailInput" 
                        class="form-input" 
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button id="resetBtn" type="submit" class="btn-primary">
                    Send Reset Link
                </button>
            </form>

            <div class="auth-footer">
                <a href="/login.html" class="link">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="firebase-config.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
